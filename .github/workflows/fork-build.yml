name: Fork Build

# Manual-only build for this fork. Updater artifacts are disabled via
# fork/tauri-no-updater.json because the upstream signing key is unavailable.

on:
  workflow_dispatch:
    inputs:
      windows_x64:
        description: 'Windows x64'
        type: boolean
        default: true
      windows_arm64:
        description: 'Windows ARM64'
        type: boolean
        default: true
      macos_arm64:
        description: 'macOS Apple Silicon'
        type: boolean
        default: true
      macos_x64:
        description: 'macOS Intel'
        type: boolean
        default: true
      linux_x64:
        description: 'Linux x64'
        type: boolean
        default: true
      linux_arm64:
        description: 'Linux ARM64'
        type: boolean
        default: true
      linux_armv7:
        description: 'Linux ARMv7'
        type: boolean
        default: true
      publish_release:
        description: 'Publish a GitHub Release with the built packages'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select targets
        id: select
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          all='[
            {"input":"windows_x64",   "os":"windows-latest", "target":"x86_64-pc-windows-msvc",        "arch":""},
            {"input":"windows_arm64", "os":"windows-latest", "target":"aarch64-pc-windows-msvc",       "arch":""},
            {"input":"macos_arm64",   "os":"macos-latest",   "target":"aarch64-apple-darwin",          "arch":""},
            {"input":"macos_x64",     "os":"macos-latest",   "target":"x86_64-apple-darwin",           "arch":""},
            {"input":"linux_x64",     "os":"ubuntu-22.04",   "target":"x86_64-unknown-linux-gnu",      "arch":""},
            {"input":"linux_arm64",   "os":"ubuntu-22.04",   "target":"aarch64-unknown-linux-gnu",     "arch":"arm64"},
            {"input":"linux_armv7",   "os":"ubuntu-22.04",   "target":"armv7-unknown-linux-gnueabihf", "arch":"armhf"}
          ]'
          matrix=$(jq -c --argjson inp "$INPUTS" '[.[] | select($inp[.input] == true or $inp[.input] == "true")]' <<<"$all")
          if [ "$matrix" = "[]" ]; then
            echo "::error::No platform selected"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.[].input' <<<"$matrix"

  build:
    needs: plan
    name: ${{ matrix.input }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          # Version comes from rust-toolchain.toml, so upstream bumps need no workflow change.
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-fork'
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
          cache-all-crates: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && matrix.arch == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Linux cross compilation
        if: runner.os == 'Linux' && matrix.arch != ''
        run: |
          cat > /tmp/sources.list << EOF
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1:${{ matrix.arch }} \
            libwebkit2gtk-4.1-dev:${{ matrix.arch }} \
            libayatana-appindicator3-dev:${{ matrix.arch }} \
            libssl-dev:${{ matrix.arch }} \
            patchelf:${{ matrix.arch }} \
            librsvg2-dev:${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          else
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies and sidecars
        run: |
          pnpm install --frozen-lockfile
          pnpm run prebuild ${{ matrix.target }}

      - name: Tauri build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig/:$PKG_CONFIG_PATH
            export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu/
          elif [ "${{ matrix.arch }}" = "armhf" ]; then
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig/:$PKG_CONFIG_PATH
            export PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf/
          fi
          pnpm build -c fork/tauri-no-updater.json --target ${{ matrix.target }}

      - name: Collect packages
        run: |
          shopt -s nullglob
          b=target/${{ matrix.target }}/release/bundle
          mkdir -p out
          for f in "$b"/nsis/*.exe "$b"/dmg/*.dmg "$b"/deb/*.deb "$b"/rpm/*.rpm; do
            cp "$f" out/
          done
          ls -la out

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clash-verge-${{ matrix.input }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    # Publish whatever built successfully; failed platforms can be rerun later.
    if: ${{ inputs.publish_release && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: clash-verge-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::No packages were built"
            exit 1
          fi
          version=$(jq -r .version package.json)
          tag="fork-v${version}-${GITHUB_RUN_NUMBER}"
          cat > notes.md << EOF
          基于官方 Clash Verge Rev v${version}，提交 \`${GITHUB_SHA::8}\`。修改内容见 [FORK.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/FORK.md)。

          - 安装后请在「设置 → 杂项设置」中关闭「自动检查更新」，否则会被官方版本覆盖。
          - 安装包没有代码签名：Windows 提示「未知发布者」时选择「仍要运行」；macOS 提示「已损坏」时，在终端执行 \`xattr -cr "/Applications/Clash Verge.app"\`。
          EOF
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Clash Verge ${version} 修改版 #${GITHUB_RUN_NUMBER}" \
            --notes-file notes.md
